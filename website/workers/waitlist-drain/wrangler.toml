# The waitlist drain Worker (D-427): hourly, sends held confirmation emails.
#
# Deployed on its own, from website/ (the coordinator does this, never CI):
#   npx wrangler deploy --config workers/waitlist-drain/wrangler.toml
#   npx wrangler secret put RESEND_API_KEY --config workers/waitlist-drain/wrangler.toml
# Same D1 database as the Pages project (wrangler.toml); the vars below that
# repeat the Pages project's (MAIL_*, the caps) must be kept in step with it.
name = "apelles-waitlist-drain"
main = "index.ts"
compatibility_date = "2026-10-01"

[triggers]
crons = ["7 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "apelles-waitlist"
database_id = "a954787b-3464-432b-bcd7-7ec097845f69"

[vars]
SITE_ORIGIN = "https://apelles.studio"
MAIL_FROM = "Apelles <hello@mail.apelles.studio>"
MAIL_REPLY_TO = "hello@apelles.studio"
CONFIRM_EMAILS_PER_DAY = "90"
CONFIRM_EMAILS_PER_MONTH = "2900"
