[package]
name = "chroma-project"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chroma L2 — the `.chroma` project document (D-037/D-038): the versioned project.json manifest, its schema migrations, the media pool + bins (D-044/D-045/D-059), the unified clip identity model (D-070) and the project's timeline lifecycle. No tauri, no wgpu, no AppState."

[dependencies]
# D-053: `MediaVideoInfo.resolution` is a `chroma_types::Resolution`.
chroma-types = { path = "../chroma-types" }
chroma-timeline = { path = "../chroma-timeline" }
# D-148, correcting `architecture-lock.md`: the project model probes and
# thumbnails the media it references (`video::probe`, `video::extract_thumb`,
# `probe::probe_cached`). Legal in the locked graph — L2 -> L1 — but the
# lock doc's dependency table did not list it. It does now.
chroma-media = { path = "../chroma-media" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
chrono = "0.4"
log = "0.4"
once_cell = "1.21"
uuid = { version = "1.25", features = ["v4", "serde"] }
