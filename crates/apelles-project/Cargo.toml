[package]
name = "apelles-project"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L2 — the `.chroma` project document (D-037/D-038): the versioned project.json manifest, its schema migrations, the media pool + bins (D-044/D-045/D-059), the unified clip identity model (D-070) and the project's timeline lifecycle. No tauri, no wgpu, no AppState."

[dependencies]
# D-053: `MediaVideoInfo.resolution` is a `apelles_types::Resolution`.
apelles-types = { path = "../apelles-types" }
apelles-timeline = { path = "../apelles-timeline" }
# D-148, correcting `architecture-lock.md`: the project model probes and
# thumbnails the media it references (`video::probe`, `video::extract_thumb`,
# `probe::probe_cached`). Legal in the locked graph — L2 -> L1 — but the
# lock doc's dependency table did not list it. It does now.
apelles-media = { path = "../apelles-media" }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.23"
chrono = "0.4"
log = "0.4"
once_cell = "1.21"
uuid = { version = "1.25", features = ["v4", "serde"] }

[dev-dependencies]
# D-292 — this crate's tests need to WRITE a real still (a PNG on disk) to
# assert that importing one produces a probed, online pool item. `image` is
# already in the workspace's tree via `apelles-media` (which is where all this
# crate's actual image *reading* lives — nothing here decodes a pixel), pinned
# to the same version, so this is a test-only re-use of an existing dependency
# rather than a new one to weigh.
image = "0.25.10"
