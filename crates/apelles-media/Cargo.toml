[package]
name = "apelles-media"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L1 — media I/O: ffmpeg/ffprobe video probe + frame decode (D-015), the persistent sequential decode-pipe pool (D-030/D-125), and the source-keyed disk cache for derived media artefacts (D-128). No tauri, no wgpu, no timeline model."

[features]
# Test-only hooks (`media_cache::init_for_tests`, `decode_pipe::open_pipe_count`)
# that this crate's own `#[cfg(test)]` code needs AND that `app/src-tauri`'s
# tests still need now that the code lives here. Enabled from `app/src-tauri`'s
# `[dev-dependencies]` only, so a release build of the app links none of them —
# see this crate's README for why a feature rather than an unconditional
# `#[doc(hidden)] pub`.
test-support = []

[dependencies]
apelles-types = { path = "../apelles-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
once_cell = "1.21"
image = "0.25.10"
base64 = "0.23"
blake3 = "1.8.7"
walkdir = "2.5.0"
filetime = "0.2"
futures = "0.3.34"
# `filmstrip`'s per-chunk async locks + extraction semaphore, and its
# `spawn_blocking` around the real `ffmpeg` pass.
tokio = { version = "1", features = ["rt", "sync"] }
# The Edit-tab audio engine (D-049): decode (symphonia) → resample (rubato) →
# format-convert (dasp_sample) → device output (cpal). The audio stack named
# in D-039 / architecture-lock.md. Versions pinned to match what
# `app/src-tauri` had before D-146 moved this code — a move, not an upgrade.
symphonia = { version = "0.6.1", features = ["isomp4", "aac", "alac", "aiff", "mp3"] }
# B-162/D-311 — symphonia has no Opus decoder at all (confirmed against its
# own feature list, not a missing flag), so a WebM/Opus source (yt-dlp's own
# default) played silently with no audio. This is the one real exception to
# "pure Rust, no FFI" above: it bundles and compiles the real libopus
# reference implementation rather than reimplementing the codec. Registered
# alongside symphonia's own default codecs in `audio::codec_registry()`, not
# in place of them.
symphonia-adapter-libopus = "0.3.0"
cpal = "0.18.2"
rubato = "0.15"
dasp_sample = "0.11.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tempfile = "3.27.0"

# D-397 — the macOS Vision framework, for `ocr` (the highlight suggester's text
# boxes). Same objc2 family and versions `tauri`/`wry` already link, so the
# only new crate in the tree is `objc2-vision` itself.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes", "VNRequestRevisionProviding", "objc2-core-foundation"] }
