[package]
name = "apelles-types"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L0 — shared value types (Frame/Rational/Resolution/ColorSpace/TimeRange), typed IDs, error enums. Zero heavy deps."

[dependencies]
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# D-452 — the decoded-frame handle (`video_frame::PixelBuffer`) the media
# engine and the GPU engine exchange: a retained CoreVideo buffer. Only the two
# thin binding crates for that one type, on the one platform that has it.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-foundation = { version = "0.3.2", default-features = false, features = ["std"] }
objc2-core-video = { version = "0.3.2", default-features = false, features = ["std", "CVBase", "CVBuffer", "CVImageBuffer", "CVPixelBuffer", "CVReturn"] }
