[package]
name = "chroma-media"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Chroma L1 — media I/O: ffmpeg/ffprobe video probe + frame decode (D-015), the persistent sequential decode-pipe pool (D-030/D-125), and the source-keyed disk cache for derived media artefacts (D-128). No tauri, no wgpu, no timeline model."

[features]
# Test-only hooks (`media_cache::init_for_tests`, `decode_pipe::open_pipe_count`)
# that this crate's own `#[cfg(test)]` code needs AND that `app/src-tauri`'s
# tests still need now that the code lives here. Enabled from `app/src-tauri`'s
# `[dev-dependencies]` only, so a release build of the app links none of them —
# see this crate's README for why a feature rather than an unconditional
# `#[doc(hidden)] pub`.
test-support = []

[dependencies]
chroma-types = { path = "../chroma-types" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
log = "0.4"
once_cell = "1.21"
image = "0.25.10"
base64 = "0.23"
blake3 = "1.8.7"
walkdir = "2.5.0"
filetime = "0.2"
futures = "0.3.34"
# `filmstrip`'s per-chunk async locks + extraction semaphore, and its
# `spawn_blocking` around the real `ffmpeg` pass.
tokio = { version = "1", features = ["rt", "sync"] }
# The Edit-tab audio engine (D-049): decode (symphonia) → resample (rubato) →
# format-convert (dasp_sample) → device output (cpal). Pure Rust, no FFI; the
# audio stack named in D-039 / architecture-lock.md. Versions pinned to match
# what `app/src-tauri` had before D-146 moved this code — a move, not an
# upgrade.
symphonia = { version = "0.6.1", features = ["isomp4", "aac", "alac", "aiff", "mp3"] }
cpal = "0.18.2"
rubato = "0.15"
dasp_sample = "0.11.0"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "macros"] }
tempfile = "3.27.0"
