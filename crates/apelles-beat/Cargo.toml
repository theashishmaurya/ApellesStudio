[package]
name = "apelles-beat"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L2 — musical beat analysis: tempo, beat grid, downbeats/bars and per-beat accent strength for an audio file, computed on-device and cached by content hash (D-413). Read-only: returns times in seconds, never edits anything."

[dependencies]
apelles-media = { path = "../apelles-media" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = "0.4"
blake3 = "1.8.7"
# D-414 — the real-input FFT behind the spectrogram. Already in the lockfile
# (through `rubato`, which `apelles-media` uses to resample), so this adds no
# new crate to the tree: the same version, now a direct dependency.
realfft = "3.5.0"

[dev-dependencies]
apelles-media = { path = "../apelles-media", features = ["test-support"] }
tempfile = "3.27.0"
