[package]
name = "apelles-ai"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L2 — the AI sidecar client (D-145, crate-extraction-plan.md §2.5): lifecycle supervision (spawn/health/hash) for the ai/ FastAPI sidecar, plus the /segment, /track, /refine_track, /depth_track, /health HTTP wire plumbing. No AppHandle, no fork-side global state, no GPU."

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
log = "0.4"
sha2 = "0.11"
image = "0.25.10"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
# D-385 — `understanding_cache` persists transcripts + applied re-reads through
# `apelles_media::media_cache` (D-128) rather than a second cache. A downward
# L3 → L1 edge, allowed by D-039's one-way graph. `blake3` is the version
# `apelles-media` already pins, used for the record key.
apelles-media = { path = "../apelles-media" }
blake3 = "1.8.7"

[dev-dependencies]
# `media_cache::init_for_tests` binds a temp cache root for this crate's tests.
apelles-media = { path = "../apelles-media", features = ["test-support"] }
