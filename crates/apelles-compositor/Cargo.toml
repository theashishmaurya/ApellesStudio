[package]
name = "apelles-compositor"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Apelles L1 — the Edit tab's one GPU render engine (wgpu/Metal): layer paint (crop, resample, rounded corners, rotation, opacity, source-over), the baked Colorist grade (3D LUT) and adjustment-clip operators, for the live preview and the export alike (D-449)."

[dependencies]
apelles-gpu = { path = "../apelles-gpu" }
apelles-types = { path = "../apelles-types" }
wgpu = "29.0" # pinned to the version apelles-gpu and app/src-tauri use (P3 colour shift, see apelles-gpu)
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
image = { version = "0.25.10", default-features = false }
thiserror = { workspace = true }
log = "0.4"
