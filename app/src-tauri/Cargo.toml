[package]
name = "RapidRAW"
description = "A blazingly-fast, non-destructive, and GPU-accelerated RAW image editor built with performance in mind."
authors = ["Timon Käch"]
edition = "2024"
rust-version = "1.98"

[lib]
name = "rapidraw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
tethering = ["dep:gphoto2"]
# D-104: gates the embedded WebDriver server (real E2E testing via
# WebdriverIO's @wdio/tauri-service) into the binary. Off by default —
# `cfg(debug_assertions)` is NOT a valid `[target.'cfg(...)']` dependency
# selector (Cargo only supports target-related cfg there: target_os/
# target_arch/etc, not build-profile flags — confirmed by Cargo's own
# warning when this was first tried that way), so this has to be an
# explicit opt-in feature instead, built with `cargo build --features
# e2e-testing` (or via `docs/notes/e2e-testing.md`'s wdio config, which
# passes it through). Never enabled for a real release build.
e2e-testing = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
# Chroma's own layered crates (D-039 thin-shell/fat-core). Pure domain models,
# no wgpu/ffmpeg — see crates/README.md.
chroma-timeline = { path = "../../crates/chroma-timeline" }
chroma-motion = { path = "../../crates/chroma-motion" }
chroma-grade-model = { path = "../../crates/chroma-grade-model" }
chroma-types = { path = "../../crates/chroma-types" }
chroma-gpu = { path = "../../crates/chroma-gpu" }
chroma-ai = { path = "../../crates/chroma-ai" }
chroma-media = { path = "../../crates/chroma-media" }
chroma-project = { path = "../../crates/chroma-project" }
# Chroma editor-tab audio playback (D-049) — decode (symphonia) → resample
# (rubato) → format-convert (dasp_sample) → device output (cpal). Pure Rust,
# no FFI; the audio stack named in D-039/architecture-lock.md.
symphonia = { version = "0.6.1", features = ["isomp4", "aac", "alac", "aiff", "mp3"] }
cpal = "0.18.2"
rubato = "0.15"
dasp_sample = "0.11.0"
tauri = { version = "2.11", features = [ "macos-private-api", "rustls-tls", "protocol-asset" ] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
image = "0.25.10"
base64 = "0.23"
tauri-plugin-fs = "2.5.1"
rayon = "1.12.0"
blake3 = "1.8.7"
wgpu = "29.0" # Downgraded to prevent P3 color shifts on Apple devices
pollster = "1.0"
bytemuck = { version = "1.25", features = ["derive"] }
anyhow = "1.0.104"
kamadak-exif = "0.6.1"
rawler = { git = "https://github.com/CyberTimon/RapidRAW-DngLab.git" }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1.25", features = ["v4", "serde"] }
walkdir = "2.5.0"
imageproc = "0.27.0"
# Chroma: text/title clip rasterisation (D-209/D-210, `chroma::text`). Already
# in this workspace's tree as `imageproc`'s own dependency at exactly this
# version — declaring it directly adds no new crate to the build, it just
# lets `chroma::text` name the glyph-outlining API instead of going through
# `imageproc::drawing::draw_text_mut` (which blends premultiplied, wrong for
# the transparent layer the compositor needs). Apache-2.0/MIT.
ab_glyph = "0.2.32"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "load-dynamic"] }
ndarray = "0.16"
tauri-plugin-process = "2.3.1"
tauri-plugin-os = "2.3.2"
log = "0.4"
fern = "0.7"
little_exif = "0.6.23"
chrono = "0.4"
tokenizers = { version = "0.23.1", default-features = false, features = ["onig"] }
once_cell = "1.21"
futures = "0.3.34"
sha2 = "0.11"
nalgebra = "0.35.0"
hex = "0.4"
rand = "0.10"
tauri-plugin-shell = "2.3.5"
tempfile = "3.27.0"
mimalloc = "0.1.52"
image_hasher = "3.1.1"
regex = "1.13.1"
memmap2 = "0.9.11"
half = { version = "2.7.1", features = ["bytemuck"] }
glam = "0.33.5"
quick-xml = { version = "0.41", features = ["serialize"] }
fuzzy-matcher = "0.3.7"
image-hdr = { version = "0.6.0", default-features = false }
mozjpeg-rs = "0.9.2"
webp = "0.3"
jxl-oxide = { version = "0.12.6", features = ["image"] }
jxl-encoder = "0.3.1"
filetime = "0.2"
libc = "0.2.189"
rgb = "0.8.53"
imgref = "1.12.2"
sysinfo = "0.39.6"
tiny_http = "0.12" # Chroma: the in-app control server (D-020)
# Chroma: real E2E testing (D-104) — backend access/mocking side of
# WebdriverIO's @wdio/tauri-service. Always present (its own permission
# system gates what it can do); the actual embedded WebDriver SERVER
# (`tauri-plugin-wdio-webdriver`) is `optional`, only pulled in by the
# `e2e-testing` feature above (see that comment for why: `cfg(debug_assertions)`
# is not a valid dependency selector).
tauri-plugin-wdio = "1.3.0"
tauri-plugin-wdio-webdriver = { version = "1.3.0", optional = true }

[target.'cfg(any(target_os = "windows", target_os = "macos", target_os = "linux"))'.dependencies]
trash = "5.2.6"
tauri-plugin-single-instance = "2.4.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }

[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
gphoto2 = { git = "https://github.com/CyberTimon/libgphoto2-rs", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"
# Chroma: the in-process WKWebView screenshot (D-209). All five are already in
# the workspace lock as transitive deps of tauri/wry/muda/cpal — naming them
# here adds a direct edge, not a new crate to the build. `objc2-*` (the
# maintained successor to the `objc` 0.2 above, same `objc2` project as wry's
# own bindings) gives the *typed*, selector-checked
# `takeSnapshotWithConfiguration:completionHandler:` instead of a hand-rolled
# `msg_send!` — see D-209 and docs/notes/debug-screenshot-tool.md.
block2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSBitmapImageRep",
    "NSGraphics",
    "NSImage",
    "NSImageRep",
] }
objc2-foundation = { version = "0.3", features = [
    "NSData",
    "NSDictionary",
    "NSError",
    "NSString",
] }
objc2-web-kit = { version = "0.3", features = [
    "WKSnapshotConfiguration",
    "WKWebView",
    "block2",
    "objc2-app-kit",
] }

[target.'cfg(target_os = "android")'.dependencies]
ndk-context = "0.1"
jni = "0.21"
jni22 = { package = "jni", version = "0.22" }
rustls-platform-verifier = "0.7"
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls"] }
include_dir = "0.7.4"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18.2"
webkit2gtk = "=2.0.2"
webkit2gtk-nvidia-quirk = "2.0"

[dev-dependencies]
# D-146 — `chroma-media`'s test-only hooks (`media_cache::init_for_tests`,
# `decode_pipe::open_pipe_count`) are behind its `test-support` feature.
# Enabling it *here* rather than in `[dependencies]` is what keeps them out of
# a release build while `cargo test` / `cargo check --all-targets` still see
# them: Cargo unifies a dev-dependency's features only for the targets that
# actually need dev-dependencies.
chroma-media = { path = "../../crates/chroma-media", features = ["test-support"] }

[build-dependencies]
tauri-build = { version = "2.6", features = [] }
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
hex = "0.4"

# Build profiles moved to the workspace root `Cargo.toml` (D-039) — Cargo ignores
# `[profile.*]` in a non-root workspace member.

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
