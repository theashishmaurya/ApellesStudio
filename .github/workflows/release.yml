# Builds the macOS app and publishes a GitHub Release when a version tag is
# pushed (D-392). Push `vX.Y.Z` and this does the rest:
#
#   1. checks the tag equals the root package.json version (the bundle takes
#      its version from there, D-388) and that docs/releases/<tag>.md exists
#      (the release notes, written by hand and committed before tagging);
#   2. builds the release DMG on an Apple Silicon runner with the same command a
#      developer uses locally, `npm run tauri:build` (ad-hoc signed, D-388;
#      bundled ffmpeg/ffprobe/uv/apelles-mcp, D-389/D-390; the Motion engine pack
#      in Resources/motion-engine, D-417 — Node.js and Chrome Headless Shell are
#      NOT bundled, the app downloads them the first time the Motion tab opens);
#   3. verifies the bundle: signature, every bundled binary present, the Motion
#      engine pack present, and the shipped MCP server carrying its `motion_*`
#      tools (D-417 lifted D-391's hide);
#   4. publishes the release with the DMG, its SHA-256, and the FFmpeg 9.0.2
#      source tarball, which D-389's GPL-3.0 obligations call for alongside
#      every distributed copy of the bundled ffmpeg.
#
# It does NOT run the test suites: the workspace's tests need a GPU and a
# running app for parts of them, which a hosted runner does not have, and
# `tsc` carries a known pre-existing error baseline. They are run locally
# before tagging (docs/releases/README.md). It does not notarize: there is no
# Developer ID yet (D-388).
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FFMPEG_VERSION: "9.0.2"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version, and the notes exist
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if [ ! -f "docs/releases/$GITHUB_REF_NAME.md" ]; then
            echo "::error::docs/releases/$GITHUB_REF_NAME.md is missing; write the release notes before tagging"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      # The Node the app downloads for Motion (apelles-motion-runtime's pin), so
      # the engine pack's build-time self-test runs the component check on the
      # same Node users get. Any 22.18+ would build it.
      # No npm cache, deliberately — see the Rust note below.
      - uses: actions/setup-node@v4
        with:
          node-version: 24.22.1

      # rust-toolchain.toml pins the channel; rustup installs it here.
      - name: Rust toolchain
        run: rustup toolchain install

      # NO BUILD CACHE ON A RELEASE (owner, 2026-11-10). A release is published
      # once and installed by everyone, so it is built from scratch: what ships
      # is then a function of this commit alone, not of whatever a cache happened
      # to be holding. Costs roughly 15-25 minutes a release, paid a few times a
      # year, and removes a whole class of "works in CI, stale in the artifact"
      # question that is miserable to debug after the fact.
      #
      # To be clear about what this does NOT fix: B-402 (v0.3.0 could not start)
      # was a source bug and would have shipped identically from a cold build.
      # The control that catches that one is the smoke-test step below.

      - run: npm ci

      # D-458 — the updater artifacts (`Apelles.app.tar.gz` + `.sig`) are enabled
      # HERE, not in the committed config, so a local `npm run tauri:build` still
      # works for anyone without the signing key. The private key exists only as
      # this secret; its public half is compiled into the app from
      # `tauri.conf.json`, and the app refuses an update signed by anything else.
      - name: Build the app and DMG
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # D-458 — the updater is OPTIONAL at release time. With the signing
          # secret present the build also emits `Apelles.app.tar.gz` + `.sig`
          # and the job publishes a manifest; without it the release is exactly
          # what it was before, a DMG people download. What must never happen is
          # publishing an update nobody can verify, so the choice is made by
          # whether the secret exists — never by a flag someone can forget.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "UPDATER=1" >> "$GITHUB_ENV"
            npm run tauri:build -- --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "UPDATER=0" >> "$GITHUB_ENV"
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set — releasing without updater artifacts (D-458)"
            npm run tauri:build
          fi

      - name: Verify the bundle
        run: |
          app=target/release/bundle/macos/Apelles.app
          dmg="target/release/bundle/dmg/Apelles_${VERSION}_aarch64.dmg"
          test -f "$dmg"
          codesign --verify --deep --strict "$app"
          for bin in apelles apelles-mcp ffmpeg ffprobe uv; do
            test -x "$app/Contents/MacOS/$bin" || { echo "::error::missing $bin"; exit 1; }
          done
          test -d "$app/Contents/Resources/resources/sidecars/ai"
          test -d "$app/Contents/Resources/resources/sidecars/ai-media"
          # D-417: the Motion engine pack (prebuilt bundle + renderer + check).
          pack="$app/Contents/Resources/motion-engine"
          for f in pack.json bundle/index.html scripts/render.mts scripts/check-component.mts \
                   node_modules/@remotion/renderer/package.json node_modules/typescript/lib/typescript.js; do
            test -f "$pack/$f" || { echo "::error::the Motion engine pack has no $f"; exit 1; }
          done
          test -f "$app/Contents/Resources/resources/licenses/MOTION-RUNTIME-NOTICE.txt"
          # D-417 (lifting D-391): the MCP server ships its Motion tools again.
          for tool in motion_add_layer motion_runtime_status motion_install_runtime; do
            strings "$app/Contents/MacOS/apelles-mcp" | grep -q "$tool" \
              || { echo "::error::the bundled apelles-mcp has no $tool"; exit 1; }
          done
          plist_version=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Contents/Info.plist")
          test "$plist_version" = "$VERSION"
          du -sh "$app" "$dmg"
          echo "DMG=$dmg" >> "$GITHUB_ENV"

      # D-458 — the update manifest the installed app polls. One platform today
      # (macOS arm64, v1's one platform); the `url` points at THIS tag's asset
      # while the endpoint in the config points at `releases/latest/download`,
      # so an older app always resolves to the newest manifest.
      # B-402 — RUN the thing. v0.3.0 shipped a startup panic that every other
      # check here passed straight over: it compiled, 520 tests passed, the
      # bundle verified, the DMG built. None of that executes the binary, and
      # the app died in `tauri::Builder::build()` before a window existed, so
      # the release was unlaunchable for everyone who downloaded it.
      #
      # Deliberately narrow: it fails on a PANIC, not on an early exit, because
      # a GUI app on a headless runner may legitimately not stay up and a check
      # that false-fails is a check someone will disable. A startup panic is
      # exactly the class that shipped, and it is unambiguous in the log.
      - name: Smoke-test the built app
        run: |
          app="target/release/bundle/macos/Apelles.app"
          "$app/Contents/MacOS/apelles" > smoke.log 2>&1 &
          pid=$!
          sleep 25
          kill $pid 2>/dev/null || true
          wait $pid 2>/dev/null || true
          echo "--- first 60 lines of the app's own output ---"
          head -60 smoke.log || true
          if grep -qE "panicked at|PluginInitialization|error while building tauri application" smoke.log; then
            echo "::error::the built app failed at startup — see the output above (B-402)"
            exit 1
          fi
          echo "no startup panic"

      - name: Build the update manifest
        if: env.UPDATER == '1'
        run: |
          bundle=target/release/bundle/macos
          tar="$bundle/Apelles.app.tar.gz"
          test -f "$tar" || { echo "::error::no updater artifact at $tar"; exit 1; }
          test -f "$tar.sig" || { echo "::error::the updater artifact is unsigned"; exit 1; }
          node -e '
            const fs = require("fs");
            const version = process.env.VERSION;
            const tag = process.env.GITHUB_REF_NAME;
            const sig = fs.readFileSync(process.argv[1], "utf8").trim();
            const notes = fs.existsSync(`docs/releases/${tag}.md`)
              ? fs.readFileSync(`docs/releases/${tag}.md`, "utf8").split("\n").slice(0, 3).join(" ").trim()
              : `Apelles ${version}`;
            fs.writeFileSync("latest.json", JSON.stringify({
              version,
              notes,
              pub_date: new Date().toISOString(),
              platforms: {
                "darwin-aarch64": {
                  signature: sig,
                  url: `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/${tag}/Apelles.app.tar.gz`,
                },
              },
            }, null, 2));
          ' "$tar.sig"
          cat latest.json

      - name: Collect release assets
        run: |
          mkdir -p release
          cp "$DMG" release/
          # D-458 — what the installed app downloads, and the manifest it reads.
          # Only when the build was signed; see the build step.
          if [ "$UPDATER" = "1" ]; then
            cp target/release/bundle/macos/Apelles.app.tar.gz release/
            cp latest.json release/
          fi
          # GPL-3.0 corresponding source for the bundled ffmpeg (D-389).
          curl -fsSLo "release/ffmpeg-${FFMPEG_VERSION}.tar.xz" \
            "https://ffmpeg.org/releases/ffmpeg-${FFMPEG_VERSION}.tar.xz"
          cd release && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --verify-tag \
            --title "Apelles ${VERSION} (beta)" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
