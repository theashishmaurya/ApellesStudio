# Apelles — Rust workspace root (D-039 migration step 1)
#
# Virtual workspace. The Tauri binary crate is `app/src-tauri` — the vendored
# RapidRAW fork (D-040), whose Cargo package is `apelles` since D-265 did the
# rename D-040 had deferred.
# `crates/*` are Apelles' own layered crates (thin-shell / fat-core, D-039):
# pure domain models with no wgpu / ffmpeg, GPU + media I/O isolated below them.
#
# 8 crates exist today, 6 of them real and load-bearing (extraction waves 1-3
# landed 2026-09-05): apelles-{types,gpu,media,timeline,grade-model,project,
# motion,ai}. Still future: apelles-grade, apelles-compositor. The live table
# and each crate's boundary are in `crates/README.md`.

[workspace]
resolver = "2"
members = [
    "app/src-tauri",
    "crates/*",
]

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
repository = "https://github.com/theashishmaurya/chroma"

# Shared dependency versions. Available to members via `<dep>.workspace = true`.
# `app/src-tauri` does NOT adopt these yet (it keeps its own pinned versions from
# the fork) — they exist so the new `crates/*` share one source of truth.
[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"

# Build profiles live at the workspace root (profiles in a non-root member are
# ignored). Moved here verbatim from `app/src-tauri/Cargo.toml` (D-040 fork) so
# the perf-tuned dev build is preserved.
[profile.dev]
opt-level = 2
debug = 1
incremental = true

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = true
strip = true
